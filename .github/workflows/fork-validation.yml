name: Studio storage unit validation

on:
  push:
    branches: [ci/validate-studio-bugfixes]

permissions:
  contents: read

concurrency:
  group: studio-storage-unit-validation
  cancel-in-progress: true

jobs:
  unit:
    name: Complete storage unit suite (one worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 4124bc8a6b3f5d250239d659e23acf1094104751
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all Studio unit tests with coverage
        run: pnpm --filter studio run test:ci --maxWorkers=1
