name: Validate current Studio PR heads
on:
  push:
    branches:
      - ci/validate-studio-bugfixes
permissions:
  contents: read
concurrency:
  group: studio-current-head-validation
  cancel-in-progress: true
env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  BASE_SHA: 26585dd4a4d6db8910a595214c9f6e8fdd206768
jobs:
  checks:
    name: Static checks (${{ matrix.fix }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:prettier
      - run: pnpm exec prettier --check e2e/studio/features/storage.spec.ts e2e/studio/utils/storage-helpers.ts
        env:
          SORT_IMPORTS: 'false'
      - run: pnpm run test:case-hazards
      - run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm --filter studio run lint:ratchet
      - run: pnpm knip --workspace apps/studio --no-progress
      - name: Check spelling in changed files
        run: |
          go install github.com/golangci/misspell/cmd/misspell@v0.8.0
          git diff --name-only -z "$BASE_SHA" HEAD | xargs -0 "$(go env GOPATH)/bin/misspell" -error -locale US
  unit:
    name: Unit coverage (${{ matrix.fix }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            shard: 1
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            shard: 2
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            shard: 1
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            shard: 2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit shard with coverage and standard test timeouts
        run: pnpm --filter studio run test:ci --maxWorkers=1 --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=unit-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-${{ matrix.fix }}-${{ matrix.shard }}
          path: |-
            apps/studio/unit-results.json
            apps/studio/coverage/lcov.info
          retention-days: 7
  docker:
    name: Docker (${{ matrix.fix }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Next production image
        run: docker build . -f apps/studio/Dockerfile --target production -t supabase-studio:validation-next --build-arg NEXT_PUBLIC_STUDIO_AUTH_MODE=supabase --no-cache
      - name: TanStack production image
        run: docker build . -f apps/studio/Dockerfile --target production -t supabase-studio:validation-tanstack --build-arg NEXT_PUBLIC_STUDIO_AUTH_MODE=supabase --build-arg STUDIO_FRAMEWORK=tanstack
  e2e:
    name: E2E (${{ matrix.fix }}, ${{ matrix.framework }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            framework: next
            shard: 1
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            framework: next
            shard: 2
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            framework: tanstack
            shard: 1
          - fix: storage
            commit: 995ed927a5e92ee7fdd27d0405de6348fad44351
            framework: tanstack
            shard: 2
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            framework: next
            shard: 1
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            framework: next
            shard: 2
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            framework: tanstack
            shard: 1
          - fix: snippets
            commit: c59ef21bc16c9a60a4c8efd36c45a1ec10fa51b7
            framework: tanstack
            shard: 2
    env:
      STUDIO_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C e2e/studio exec playwright install chromium --with-deps --only-shell
      - name: Start disposable Supabase stack
        run: SKIP_ASSET_UPLOAD=1 pnpm run e2e:setup:cli
      - name: Build Studio
        run: SKIP_ASSET_UPLOAD=1 NODE_ENV=test MODE=test NODE_OPTIONS=--max-old-space-size=4096 pnpm run build:studio
      - name: Run the complete self-hosted browser suite
        run: PWTEST_SHARD_WEIGHTS=62:38 pnpm e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-${{ matrix.fix }}-${{ matrix.framework }}-${{ matrix.shard }}
          path: e2e/studio/blob-report
          retention-days: 7
