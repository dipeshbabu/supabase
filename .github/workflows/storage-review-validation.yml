name: Storage PR review validation
'on':
  push:
    branches:
    - ci/validate-storage-review-20260918
permissions:
  contents: read
concurrency:
  group: storage-review-${{ github.ref }}
  cancel-in-progress: true
env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  e2e:
    name: Storage browser tests (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - fix: storage
          commit: 10db659bd6570744125236ca5649ae210c420ec5
          framework: next
        - fix: storage
          commit: 10db659bd6570744125236ca5649ae210c420ec5
          framework: tanstack
    env:
      STUDIO_FRAMEWORK: ${{ matrix.framework }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ matrix.commit }}
        persist-credentials: false
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm -C e2e/studio exec playwright install chromium --with-deps --only-shell
    - name: Start disposable Supabase stack
      run: SKIP_ASSET_UPLOAD=1 pnpm run e2e:setup:cli
    - name: Build Studio
      run: SKIP_ASSET_UPLOAD=1 NODE_ENV=test MODE=test NODE_OPTIONS=--max-old-space-size=4096 pnpm run build:studio
    - name: Run the Storage browser suite
      run: pnpm -C e2e/studio run e2e -- features/storage.spec.ts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: storage-${{ matrix.framework }}
        path: e2e/studio/blob-report
        retention-days: 7
